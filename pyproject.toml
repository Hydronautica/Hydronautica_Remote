[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nls"
version = "0.1.0"
description = "Pseudo-spectral nonlinear Schrödinger solver for breathers and rogue waves"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest"]
sitedata = ["pillow"]          # reads the GeoTIFF bathymetry

[tool.setuptools]
packages = ["nls", "scour", "rna", "twin", "sitedata"]

[tool.setuptools.package-data]
sitedata = ["wis_stations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
