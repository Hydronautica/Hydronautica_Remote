<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind &amp; Steel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #e9f3f7; --panel: #ffffff; --ink: #17324a; --muted: #5f7a8c; --line: #d3e2ea; --accent: #ff8a3d; --accent2: #2f9fb5; --good: #3bb273; --warn: #f2b134; --bad: #e5534b; --sea: #3aa7c1; --sea2: #1f7f99; --sand: #e8c98f; --soil: #a07a52; --sky1: #bfe6f5; --sky2: #eef9fd; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1d27; --panel: #162a37; --ink: #e6f1f6; --muted: #93aebd; --line: #24404f; --sky1: #1d3d52; --sky2: #2b5670; } }
:root[data-theme="dark"] { --bg: #0f1d27; --panel: #162a37; --ink: #e6f1f6; --muted: #93aebd; --line: #24404f; --sky1: #1d3d52; --sky2: #2b5670; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Inter, system-ui, sans-serif; }
h1, h2, h3, .num { font-family: "Baloo 2", Inter, sans-serif; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 7px 12px; background: var(--line); color: var(--ink); }
button.primary { background: var(--accent); color: #fff; font-weight: 600; }
button.go { background: var(--good); color: #fff; font-weight: 600; }
button:disabled { opacity: 0.45; cursor: default; }
.hud { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 2px solid var(--line); position: sticky; top: 0; z-index: 5; }
.hud h1 { margin: 0 8px 0 0; font-size: 1.5rem; color: var(--accent); }
.chip { display: flex; flex-direction: column; line-height: 1.1; padding: 2px 8px; border-radius: 8px; background: var(--bg); }
.chip small { color: var(--muted); font-size: 0.7rem; } .chip b { font-family: "Baloo 2"; font-size: 1.05rem; }
.fc { display: flex; gap: 4px; } .fc div { font-size: 0.72rem; padding: 2px 6px; border-radius: 6px; background: var(--bg); text-align: center; }
.storm { color: var(--bad); font-weight: 700; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 6px; padding: 10px 16px 0; flex-wrap: wrap; }
.tabs button { border-radius: 10px 10px 0 0; background: transparent; font-weight: 600; color: var(--muted); }
.tabs button.on { background: var(--panel); color: var(--ink); }
main { padding: 0 16px 24px; }
.screen { background: var(--panel); border-radius: 0 14px 14px 14px; padding: 14px; min-height: 60vh; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 14px; }
@media (max-width: 1050px) { .grid3 { grid-template-columns: 1fr; } }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
canvas { width: 100%; display: block; border-radius: 12px; touch-action: none; }
.card { background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.card h3 { margin: 0 0 6px; font-size: 1.05rem; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); } .small { font-size: 0.8rem; }
label.f { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; margin: 6px 0; font-size: 0.85rem; }
label.f input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.chk { margin: 8px 0; } .chk .top { display: flex; justify-content: space-between; font-size: 0.85rem; }
.bar { position: relative; height: 14px; background: var(--panel); border-radius: 7px; margin-top: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar .band { position: absolute; top: 0; bottom: 0; opacity: 0.35; }
.bar .est { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--ink); }
.bar .lim { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); }
.bar .win { position: absolute; top: 0; bottom: 0; background: var(--good); opacity: 0.25; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: #fff; }
.pill.good { background: var(--good); } .pill.warn { background: var(--warn); } .pill.bad { background: var(--bad); } .pill.mute { background: var(--muted); }
.hb { display: grid; grid-template-columns: 90px 1fr 64px; gap: 6px; align-items: center; font-size: 0.82rem; margin: 4px 0; }
.hb .bar { margin: 0; }
.tree { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.node { background: var(--bg); border-radius: 12px; padding: 9px 11px; margin-bottom: 8px; border: 2px solid transparent; }
.node.done { border-color: var(--good); } .node.avail { border-color: var(--accent); } .node.locked { opacity: 0.55; }
.node b { display: block; } .node .small { margin: 3px 0 6px; }
.log div { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
.log .bad { color: var(--bad); } .log .good { color: var(--good); } .log .warn { color: #c98500; }
.toast { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 9; max-width: 360px; }
.toast div { background: var(--panel); border-left: 5px solid var(--accent2); padding: 8px 12px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); font-size: 0.85rem; }
.toast div.bad { border-color: var(--bad); } .toast div.good { border-color: var(--good); } .toast div.warn { border-color: var(--warn); }
.banner { text-align: center; padding: 8px; border-radius: 10px; font-weight: 700; font-family: "Baloo 2"; font-size: 1.15rem; margin-top: 8px; }
.banner.ok { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); } .banner.fail { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
.help { font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>
<div class="hud" id="hud"></div>
<nav class="tabs" id="tabs"></nav>
<main><div class="screen" id="screen"></div></main>
<div class="toast" id="toast"></div>
<script src="core.js"></script>
<script src="ui.js"></script>
</body>
</html>
